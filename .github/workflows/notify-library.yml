name: Notify Plugin Library

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install tiddlywiki
      - name: Stage flibbles fixtures where the test-edition expects them
        # The test-edition's tiddlywiki.files references
        # ../../../../../tiddlers/_system/plugins/flibbles/relink.json and
        # .../relink-titles.json (relative to test-edition/tiddlers/),
        # which resolve to /tmp/tiddlers/_system/plugins/flibbles/*.json
        # once the plugin is staged at /tmp/plugins/rimir/namespace/.
        # Locally these paths live in the dev-wiki; in CI we ship copies
        # as fixtures.
        run: |
          mkdir -p /tmp/tiddlers/_system/plugins/flibbles
          cp .github/ci-fixtures/relink.json /tmp/tiddlers/_system/plugins/flibbles/relink.json
          cp .github/ci-fixtures/relink-titles.json /tmp/tiddlers/_system/plugins/flibbles/relink-titles.json
      - name: Run tests
        run: |
          mkdir -p /tmp/plugins/rimir/namespace
          cp -r . /tmp/plugins/rimir/namespace/
          cd /tmp/plugins/rimir/namespace
          TIDDLYWIKI_CLI_MODE=1 TIDDLYWIKI_PLUGIN_PATH=/tmp/plugins npx tiddlywiki test-edition --test spec="namespace"

  notify:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Trigger library rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.LIBRARY_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/rimir-cc/tw-plugin-library/dispatches \
            -d '{"event_type":"plugin-updated","client_payload":{"plugin":"${{ github.event.repository.name }}"}}'
      - name: Trigger demo rebuild
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.LIBRARY_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/rimir-cc/tw-demo/dispatches \
            -d '{"event_type":"plugin-updated","client_payload":{"plugin":"${{ github.event.repository.name }}"}}'
